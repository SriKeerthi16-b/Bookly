<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.25" />

  <!-- Book Base Shadow & Pages -->
  <g transform="translate(0, 0)">
    <!-- Open Book Left Page -->
    <path d="M256 160 C 210 135, 140 135, 100 155 L 100 340 C 140 320, 210 320, 256 345 Z" fill="#e2e8f0" opacity="0.95" />
    
    <!-- Open Book Right Page -->
    <path d="M256 160 C 302 135, 372 135, 412 155 L 412 340 C 372 320, 302 320, 256 345 Z" fill="#ffffff" />
    
    <!-- Book Left Cover -->
    <path d="M256 172 C 210 147, 140 147, 92 167 L 92 355 C 140 335, 210 335, 256 360 Z" fill="url(#bookGrad)" />
    
    <!-- Book Right Cover -->
    <path d="M256 172 C 302 147, 372 147, 420 167 L 420 355 C 372 335, 302 335, 256 360 Z" fill="#2563eb" />
    
    <!-- Book Center Spine Glow -->
    <line x1="256" y1="160" x2="256" y2="360" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" />

    <!-- Page Text Lines Mock -->
    <line x1="130" y1="210" x2="225" y2="195" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <line x1="130" y1="245" x2="225" y2="230" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <line x1="130" y1="280" x2="200" y2="265" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />

    <line x1="287" y1="195" x2="382" y2="210" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <line x1="287" y1="230" x2="382" y2="245" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
    <line x1="287" y1="265" x2="357" y2="280" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />

    <!-- Modern Floating Sparkle / Bookmark -->
    <polygon points="256,120 264,140 285,143 270,157 274,178 256,168 238,178 242,157 227,143 248,140" fill="#fbbf24" filter="url(#glow)" />
  </g>
</svg>
